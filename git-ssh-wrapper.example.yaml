# git-ssh-wrapper 配置示例
# 实际使用时复制为 ~/.ssh/git-ssh-wrapper.yaml
# （Windows 上即 C:/Users/<你的用户名>/.ssh/git-ssh-wrapper.yaml）
#
# 每条映射由 (host, email) 唯一确定一个 ssh_key：
#   host:    remote URL 中的 <host_name>，如 github.com、gitlab.com、自建 git 服务器域名
#            （不区分大小写；ssh:// 带端口时端口无需填写）
#   email:   在该代码仓库内生效的 user.email（git config user.email，仓库本地配置
#            优先于全局配置），按配置原样精确匹配
#   ssh_key: 私钥位置，两种写法：
#            1) 仅文件名  -> 在 ~/.ssh/ 下查找，不存在则报错
#            2) 完整路径  -> 绝对路径，或相对于本配置文件所在目录的相对路径，
#                            不存在则报错（支持 ~ 和环境变量）

keys:
  # 同一 email 在不同 host 上使用不同 key
  - host: github.com
    email: alice@example.com
    ssh_key: id_ed25519_alice            # 仅文件名 -> 查找 ~/.ssh/id_ed25519_alice

  - host: gitlab.com
    email: alice@example.com
    ssh_key: id_ed25519_alice_gitlab     # 仅文件名 -> 查找 ~/.ssh/id_ed25519_alice_gitlab

  # 同一 host 下不同 user.email（不同人 / 不同身份）使用不同 key —— 核心场景：
  # 在公司仓库里 git config user.email bob@corp.example.com（仓库本地配置），
  # 在个人仓库里使用全局的 bob@example.com，即可自动切换到各自的 key
  - host: github.com
    email: bob@corp.example.com
    ssh_key: C:/Users/bob/.ssh/id_ed25519_bob_corp   # Windows 绝对路径

  - host: github.com
    email: bob@example.com
    ssh_key: ~/.ssh/id_rsa_bob           # 含 ~ 的路径（Linux/Windows 均可）

  # 自建 git 服务器
  - host: git.internal.example.com
    email: dev@corp.example.com
    ssh_key: ./keys/id_ed25519_devteam   # 相对路径：相对于本配置文件所在目录

# 可选：兜底 key。当 remote 的 (host, email) 在上面没有匹配条目时使用；
# 未配置 user.email 时也会回退到它；
# 不配置则按 ssh 默认行为透传（走 ~/.ssh/config 与 ssh-agent）。
default_key: id_ed25519
